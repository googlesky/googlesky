<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Freedom Windss — DevOps, SRE and Security Researcher</title>
  <desc id="desc">Dark teal profile header with an abstract systems topology.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060d0f"/>
      <stop offset="0.62" stop-color="#081719"/>
      <stop offset="1" stop-color="#0b2222"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fe0c0"/>
      <stop offset="1" stop-color="#5b8cef"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b7fff0" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <path d="M0 258H1200" stroke="url(#accent)" stroke-opacity="0.55"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="58" fill="#2fe0c0" font-size="17" letter-spacing="1.5">~/freedom-windss</text>
    <text x="64" y="91" fill="#779493" font-size="13" letter-spacing="2.2">BUILDING RELIABLE SYSTEMS SINCE 2013</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="60" y="158" fill="#edf9f6" font-size="52" font-weight="700" letter-spacing="-1.5">FREEDOM WINDSS</text>
    <text x="64" y="205" fill="url(#accent)" font-size="22" font-weight="600" letter-spacing="2.4">DEVOPS / SRE · SECURITY RESEARCHER</text>
    <text x="64" y="239" fill="#a7bcba" font-size="17">Resilient infrastructure. Reproducible research. Useful open source.</text>
  </g>

  <g fill="none" stroke="#2fe0c0" stroke-opacity="0.28" stroke-width="1.5">
    <path d="M850 72L964 45L1082 93L1041 181L1110 238L978 254L895 203L814 222L778 135Z"/>
    <path d="M850 72L895 203L1082 93M778 135L1041 181M964 45L978 254M814 222L1082 93M850 72L1110 238"/>
  </g>
  <g fill="#091719" stroke="#2fe0c0" stroke-width="2">
    <circle cx="850" cy="72" r="8"/>
    <circle cx="964" cy="45" r="6"/>
    <circle cx="1082" cy="93" r="9"/>
    <circle cx="1041" cy="181" r="6"/>
    <circle cx="1110" cy="238" r="8"/>
    <circle cx="978" cy="254" r="6"/>
    <circle cx="895" cy="203" r="10"/>
    <circle cx="814" cy="222" r="5"/>
    <circle cx="778" cy="135" r="7"/>
  </g>
  <g fill="#2fe0c0" filter="url(#glow)">
    <circle cx="850" cy="72" r="3"/>
    <circle cx="1082" cy="93" r="3"/>
    <circle cx="895" cy="203" r="4"/>
  </g>
  <circle cx="978" cy="254" r="3" fill="#ff7d5a"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#779493">
    <text x="826" y="50">CLOUD</text>
    <text x="1060" y="72">SECURE</text>
    <text x="867" y="232">OBSERVE</text>
  </g>
</svg>
