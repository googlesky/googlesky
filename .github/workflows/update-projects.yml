name: Refresh profile projects

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_projects.py"
      - ".github/workflows/update-projects.yml"

permissions:
  contents: write

concurrency:
  group: profile-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate project lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_projects.py

      - name: Publish changes
        run: |
          if git diff --quiet -- README.md; then
            echo "Project lists are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh project showcase"
          git push
